name: Sync from upstream

# Watch the upstream repo and pull new commits into this fork's `main`.
#
# Strategy:
#   1. Fast-forward `main` if upstream is strictly ahead → push directly.
#   2. Otherwise create a `sync/upstream-YYYYMMDD-HHMM` branch, attempt a
#      no-ff merge, and open a PR. Clean merges auto-merge as MERGE commits
#      (upstream history stays intact). If the merge has conflicts, the PR
#      is opened with conflict markers + instructions, for manual resolve.
#
# Triggers:
#   - schedule: every 6 hours (cron jitter via offset minute)
#   - workflow_dispatch: manual run from Actions tab
#
# Auth:
#   - SYNC_PAT secret (REQUIRED whenever upstream commits touch .github/workflows/):
#     a classic PAT with `repo` + `workflow` scopes, owned by an account with
#     push access. GITHUB_TOKEN is a GitHub App token and can NEVER push
#     workflow-file changes — GitHub rejects those pushes at the platform level
#     with "refusing to allow a GitHub App to create or update workflow ...".
#     Without SYNC_PAT the workflow still works for syncs that don't touch
#     workflow files, and fails fast with a clear message otherwise.
#
# Permissions: contents:write (push branches), pull-requests:write (open PRs).

on:
  schedule:
    # 07:17 / 13:17 / 19:17 / 01:17 UTC — off the :00/:30 marks to avoid
    # GitHub Actions cron stampede.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch to sync from"
        required: false
        default: "main"

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  UPSTREAM_REPO: rullerzhou-afk/clawd-on-desk
  UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_ref || 'main' }}
  LOCAL_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}" --tags --prune

      - name: Compare upstream vs fork
        id: compare
        run: |
          UPSTREAM_SHA=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          LOCAL_SHA=$(git rev-parse "origin/${LOCAL_BRANCH}")
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "local_sha=${LOCAL_SHA}"     >> "$GITHUB_OUTPUT"

          AHEAD=$(git rev-list --count "${LOCAL_SHA}..${UPSTREAM_SHA}")
          BEHIND=$(git rev-list --count "${UPSTREAM_SHA}..${LOCAL_SHA}")
          echo "ahead=${AHEAD}"   >> "$GITHUB_OUTPUT"
          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          echo "Upstream is ${AHEAD} commit(s) ahead, fork has ${BEHIND} extra commit(s)."

          if [ "${AHEAD}" = "0" ]; then
            # Fork already contains every upstream commit — either the SHAs
            # match exactly, or the fork is ahead on its own commits and
            # upstream has nothing new to pull. Either way: nothing to sync.
            echo "status=up_to_date" >> "$GITHUB_OUTPUT"
            echo "Fork already contains upstream HEAD (${UPSTREAM_SHA}); ${BEHIND} fork-only commit(s)."
            exit 0
          fi

          if git merge-base --is-ancestor "${LOCAL_SHA}" "${UPSTREAM_SHA}"; then
            echo "status=ff" >> "$GITHUB_OUTPUT"
          else
            echo "status=diverged" >> "$GITHUB_OUTPUT"
          fi

      - name: Check SYNC_PAT when upstream touches workflows
        # Fail fast with an actionable message instead of a cryptic remote
        # rejection at push time. Runs only when we're about to sync commits
        # that modify workflow files.
        if: steps.compare.outputs.status != 'up_to_date'
        env:
          HAS_SYNC_PAT: ${{ secrets.SYNC_PAT != '' }}
        run: |
          if [ "${HAS_SYNC_PAT}" != "true" ]; then
            if git diff --name-only "origin/${LOCAL_BRANCH}"..."upstream/${UPSTREAM_BRANCH}" -- .github/workflows/ | grep -q .; then
              echo "::error::Upstream sync includes .github/workflows/ changes, but SYNC_PAT is not configured. GITHUB_TOKEN (GitHub App token) can never push workflow-file changes. Create a classic PAT with repo+workflow scopes and add it as the SYNC_PAT secret in repo settings."
              exit 1
            fi
          fi

      - name: Fast-forward main
        if: steps.compare.outputs.status == 'ff'
        run: |
          git checkout "${LOCAL_BRANCH}"
          git merge --ff-only "upstream/${UPSTREAM_BRANCH}"
          git push origin "${LOCAL_BRANCH}"
          echo "Fast-forwarded ${LOCAL_BRANCH} by ${{ steps.compare.outputs.ahead }} commit(s)."

      - name: Prepare merge branch
        if: steps.compare.outputs.status == 'diverged'
        id: merge
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M)
          BRANCH="sync/upstream-${STAMP}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          git checkout -b "${BRANCH}" "origin/${LOCAL_BRANCH}"

          set +e
          git merge --no-ff --no-edit \
            -m "Merge upstream/${UPSTREAM_BRANCH} (${{ steps.compare.outputs.upstream_sha }}) into ${LOCAL_BRANCH}" \
            "upstream/${UPSTREAM_BRANCH}"
          MERGE_EC=$?
          set -e

          if [ "${MERGE_EC}" -eq 0 ]; then
            echo "merge_status=clean" >> "$GITHUB_OUTPUT"
            git push origin "${BRANCH}"
          else
            echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
            CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ',' | sed 's/,$//')
            echo "conflicts=${CONFLICTS}" >> "$GITHUB_OUTPUT"
            git add -A
            git commit -m "Merge upstream/${UPSTREAM_BRANCH} into ${LOCAL_BRANCH} (CONFLICTS - manual resolve required)" \
              || echo "no commit (nothing to merge)"
            git push origin "${BRANCH}"
          fi

      - name: Open PR for clean merge
        if: steps.compare.outputs.status == 'diverged' && steps.merge.outputs.merge_status == 'clean'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          BRANCH:  ${{ steps.merge.outputs.branch }}
          AHEAD:   ${{ steps.compare.outputs.ahead }}
          BEHIND:  ${{ steps.compare.outputs.behind }}
          UP_SHA:  ${{ steps.compare.outputs.upstream_sha }}
          LCL_SHA: ${{ steps.compare.outputs.local_sha }}
        run: |
          BODY_FILE="$(mktemp)"
          {
            echo "Automated upstream sync."
            echo
            echo "**Source:** \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\`"
            echo "**Upstream HEAD:** \`${UP_SHA}\`"
            echo "**Fork HEAD before sync:** \`${LCL_SHA}\`"
            echo "**Stats:** upstream is ${AHEAD} ahead, fork is ${BEHIND} ahead."
            echo
            echo "Merge succeeded cleanly. Auto-merge enabled — this PR merges itself; no action needed unless you want to review the diff first."
            echo
            echo "Generated by \`.github/workflows/sync-upstream.yml\`"
          } > "$BODY_FILE"

          # Retry: GitHub's API can lag behind git push by a few seconds —
          # "Head sha can't be blank / Head ref must be a branch" right after
          # pushing the branch is replication lag, not a real failure.
          PR_OK=0
          for ATTEMPT in 1 2 3 4 5; do
            if gh pr create \
              --base "${LOCAL_BRANCH}" \
              --head "${BRANCH}" \
              --title "chore: sync from upstream (${AHEAD} commit(s))" \
              --body-file "$BODY_FILE"; then
              PR_OK=1
              break
            fi
            echo "gh pr create attempt ${ATTEMPT}/5 failed for ${BRANCH}; retrying in 15s..."
            if [ "${ATTEMPT}" -lt 5 ]; then sleep 15; fi
          done

          if [ "${PR_OK}" != "1" ]; then
            echo "::warning::gh pr create failed after 5 attempts for branch ${BRANCH}. Common causes: same-repo PR with GITHUB_TOKEN bot identity, or 'Allow GitHub Actions to create PRs' disabled in repo settings. Verify with: gh pr list --head ${BRANCH}"
            echo "Sync branch \`${BRANCH}\` is pushed and ready; open a PR manually:"
            echo "  https://github.com/${GITHUB_REPOSITORY}/compare/${LOCAL_BRANCH}...${BRANCH}?expand=1"
            exit 0
          fi

          # Auto-merge clean syncs: no human review needed for a conflict-free
          # upstream merge. Requires repo setting "allow auto-merge" (already
          # enabled). A MERGE commit (not squash/rebase) so upstream commits
          # stay individually present in main and future AHEAD counts stay
          # accurate. If branch protection later requires reviews, auto-merge
          # waits for those checks instead of merging immediately.
          if gh pr merge "${BRANCH}" --auto --merge; then
            echo "Clean sync PR set to auto-merge."
          else
            echo "::warning::Could not enable auto-merge for ${BRANCH} (auto-merge may be disabled in repo settings, or branch protection blocks it). Merge manually: https://github.com/${GITHUB_REPOSITORY}/pulls?q=head:${BRANCH}"
          fi

      - name: Open PR for conflicting merge
        if: steps.compare.outputs.status == 'diverged' && steps.merge.outputs.merge_status == 'conflict'
        env:
          GH_TOKEN:  ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          BRANCH:    ${{ steps.merge.outputs.branch }}
          AHEAD:     ${{ steps.compare.outputs.ahead }}
          BEHIND:    ${{ steps.compare.outputs.behind }}
          UP_SHA:    ${{ steps.compare.outputs.upstream_sha }}
          LCL_SHA:   ${{ steps.compare.outputs.local_sha }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          BODY_FILE="$(mktemp)"
          {
            echo "Automated upstream sync **with merge conflicts**."
            echo
            echo "**Source:** \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\`"
            echo "**Upstream HEAD:** \`${UP_SHA}\`"
            echo "**Fork HEAD before sync:** \`${LCL_SHA}\`"
            echo "**Stats:** upstream is ${AHEAD} ahead, fork is ${BEHIND} ahead."
            echo
            echo "### Conflicting files"
            echo '```'
            echo "${CONFLICTS}"
            echo '```'
            echo
            echo "Conflict markers are committed verbatim so the PR diff is reviewable."
            echo "To resolve:"
            echo '```bash'
            echo "git fetch origin ${BRANCH}"
            echo "git checkout ${BRANCH}"
            echo "# resolve conflicts in the files above"
            echo "git add -A && git commit --amend --no-edit"
            echo "git push --force-with-lease origin ${BRANCH}"
            echo '```'
            echo
            echo "Generated by \`.github/workflows/sync-upstream.yml\`"
          } > "$BODY_FILE"

          # Retry: GitHub's API can lag behind git push by a few seconds —
          # "Head sha can't be blank / Head ref must be a branch" right after
          # pushing the branch is replication lag, not a real failure.
          PR_OK=0
          for ATTEMPT in 1 2 3 4 5; do
            if gh pr create \
              --base "${LOCAL_BRANCH}" \
              --head "${BRANCH}" \
              --title "chore: sync from upstream (CONFLICTS - manual resolve)" \
              --body-file "$BODY_FILE"; then
              PR_OK=1
              break
            fi
            echo "gh pr create attempt ${ATTEMPT}/5 failed for ${BRANCH}; retrying in 15s..."
            if [ "${ATTEMPT}" -lt 5 ]; then sleep 15; fi
          done

          if [ "${PR_OK}" != "1" ]; then
            echo "::warning::gh pr create failed after 5 attempts for branch ${BRANCH}. Common causes: same-repo PR with GITHUB_TOKEN bot identity, or 'Allow GitHub Actions to create PRs' disabled in repo settings. Verify with: gh pr list --head ${BRANCH}"
            echo "Sync branch \`${BRANCH}\` is pushed (with conflict markers) and ready; open a PR manually:"
            echo "  https://github.com/${GITHUB_REPOSITORY}/compare/${LOCAL_BRANCH}...${BRANCH}?expand=1"
            exit 0
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Upstream sync result"
            echo
            echo "- **Upstream:** \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\`"
            echo "- **Status:** \`${{ steps.compare.outputs.status }}\`"
            echo "- **Ahead / Behind:** ${{ steps.compare.outputs.ahead }} / ${{ steps.compare.outputs.behind }}"
            if [ -n "${{ steps.merge.outputs.branch }}" ]; then
              echo "- **Sync branch:** \`${{ steps.merge.outputs.branch }}\`"
              echo "- **Merge:** \`${{ steps.merge.outputs.merge_status }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
